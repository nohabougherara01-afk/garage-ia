<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Garage Horizon</title><style>body{font:16px system-ui;background:#09111e;color:#fff;margin:0}main{max-width:650px;margin:5vh auto;padding:24px}section{background:#142237;border:1px solid #30445a;border-radius:16px;padding:24px}label{display:block;margin:14px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #60748b;background:#09111e;color:white;font:inherit}textarea{min-height:100px}button{background:#38bdf8;border:0;border-radius:9px;padding:13px 20px;margin-top:20px;font-weight:700;cursor:pointer}small{color:#b7c9dc}#status{min-height:24px}</style></head><body><main><h1>🔧 Administration Garage Horizon</h1><p>Modifiez les informations publiques du garage. L'accès nécessite une clé secrète Cloudflare.</p><section><form id="f"><label for="secret">Clé administrateur</label><input id="secret" type="password" autocomplete="off" required><label for="name">Nom du garage</label><input id="name" maxlength="100" required value="Garage Dupont"><label for="phone">Téléphone</label><input id="phone" type="tel" maxlength="35" required value="03 89 00 00 00"><label for="hours">Horaires</label><textarea id="hours" maxlength="500" required>Lun–Ven : 8h–18h</textarea><label for="services">Prestations (une par ligne)</label><textarea id="services" maxlength="1200" required>Vidange
Pneus
Freinage</textarea><button type="submit">Enregistrer les modifications</button><p id="status" role="status" aria-live="polite"></p><small>La clé n'est pas enregistrée dans le navigateur. Les modifications nécessitent le service Cloudflare configuré.</small></form></section></main><script src="./admin-config.js"></script><script>const $=id=>document.getElementById(id);async function load(){if(!window.GARAGE_ADMIN_API)return;try{let r=await fetch(window.GARAGE_ADMIN_API+"/config");if(!r.ok)return;let d=await r.json();$("name").value=d.name||"";$("phone").value=d.phone||"";$("hours").value=d.hours||"";$("services").value=(d.services||[]).join("\n")}catch{}}$("f").onsubmit=async e=>{e.preventDefault();$("status").textContent="Enregistrement…";if(!window.GARAGE_ADMIN_API){$("status").textContent="Configurez d'abord admin-config.js et Cloudflare.";return}let data={name:$("name").value.trim(),phone:$("phone").value.trim(),hours:$("hours").value.trim(),services:$("services").value.split("\n").map(x=>x.trim()).filter(Boolean)};try{let r=await fetch(window.GARAGE_ADMIN_API+"/config",{method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("secret").value},body:JSON.stringify(data)});if(!r.ok)throw Error("Accès refusé ou configuration indisponible ("+r.status+")");$("status").textContent="Informations enregistrées !";$("secret").value=""}catch(err){$("status").textContent=err.message}};load();</script></body></html>
